<body>
<div class="winter" aria-hidden="true"></div>
<div class="app"><div class="topbar"><div id="connection" class="pill">Kontroluji…</div></div><main id="app"></main><div class="footer">VeStope.cz – Evidence a monitoring rolbařů</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://wlxrqqtvpqumvbbdfpuv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_aXH1aT3OZN2p0mMzfWLt0w_YGFBFaQl";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const app=document.getElementById("app"),connection=document.getElementById("connection");let gpsWatchId=null,currentDraft=null,currentProfile=null;
function updateConnection(){const online=navigator.onLine;connection.textContent=online?"ONLINE":"OFFLINE";connection.className="pill "+(online?"online":"offline")}addEventListener("online",updateConnection);addEventListener("offline",updateConnection);updateConnection();
async function getAuthorizedProfile(){const{data:{session}}=await client.auth.getSession();if(!session)return null;const{data:userData}=await client.auth.getUser();const user=userData?.user;if(!user)return null;const{data:groomer}=await client.from("groomers").select("name,email,role,active,default_area_id").eq("user_id",user.id).eq("active",true).maybeSingle();if(!groomer){await client.auth.signOut();return null}return{user,groomer}}
function loginView(message=""){app.innerHTML=`<section class="card"><img class="logo" src="./logo_vestope.cz.png" alt="VeStope.cz"><div class="eyebrow">TESTOVACÍ PROSTŘEDÍ</div><h1>Rolbař</h1><p>Přístup mají pouze schválení rolbaři.</p><form id="loginForm" class="login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Heslo</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">Přihlásit</button>${message?`<div class="error">${message}</div>`:""}</form><div class="small">Přístup do aplikace vytváří správce VeStope.cz.</div></section>`;document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;b.textContent="Přihlašuji…";const{data,error}=await client.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error){loginView("Nesprávný e-mail nebo heslo.");return}const{data:groomer,error:gError}=await client.from("groomers").select("name,email,role,active,default_area_id").eq("user_id",data.user.id).eq("active",true).maybeSingle();if(gError||!groomer){await client.auth.signOut();loginView("Tento účet nemá schválený přístup do aplikace.");return}homeView(data.user,groomer)})}
function homeView(user,groomer){currentProfile={user,groomer};app.innerHTML=`<section class="card homeCard"><img class="logo" src="./logo_vestope.cz.png" alt="VeStope.cz"><div class="eyebrow">TESTOVACÍ VERZE</div><h1>Připraveno?</h1><p>Já jsem připravený. Můžeme vyrazit?</p><div id="location" class="gpsbox"><span class="gpswait">📍 Mrknu, kde právě jsi…</span></div><button id="start" class="start" disabled>START</button><div id="trackAnimation" class="track-animation" aria-hidden="true"><div class="track-base"></div><div class="track-done"></div><img class="groomer" src="./groomer.svg" alt="Sněžná rolba"><div class="snow"></div></div><div id="startStatus" class="status">GPS se připravuje. START zpřístupním, až budu mít polohu.</div><div class="account"><span>${escapeHtml(groomer?.name||user?.email||"Rolbař")}</span><button id="logout" class="secondary">Odhlásit</button></div></section>`;document.getElementById("start").addEventListener("click",()=>currentDraft?stopAndOpenForm():startTracking());document.getElementById("logout").addEventListener("click",async()=>{stopTracking();currentDraft=null;await client.auth.signOut();loginView()});requestInitialLocation(groomer?.default_area_id)}
async function requestInitialLocation(areaId){const el=document.getElementById("location"),status=document.getElementById("startStatus"),button=document.getElementById("start");if(!navigator.geolocation){el.innerHTML='<span class="gpserror">GPS toto zařízení nepodporuje.</span>';status.textContent="Bez GPS dnes nevyrazíme.";return}status.textContent="Mrknu, kde právě jsi…";navigator.geolocation.getCurrentPosition(async position=>{const nearest=await detectNearestStart(position,areaId);renderLocation(el,position,nearest);button.disabled=false;button.dataset.gpsReady="true";status.className="status";status.innerHTML='<span class="gpsok">✓ GPS mám. Můžeš vyrazit.</span>'},error=>{button.disabled=true;button.dataset.gpsReady="false";el.innerHTML='<span class="gpserror">📍 GPS zatím nevidím.</span><br><span style="font-size:12px;color:#8290a0">Povol přístup k poloze a zkus to znovu.</span>';status.textContent=error.code===1?"Poloha není povolená. Bez GPS START nespustím.":"Poloha není momentálně dostupná. START počká, až ji chytím."},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function renderLocation(el,position,nearest){
  if(nearest){
    el.innerHTML=`<div class="gps-state"><span>Jsi u výchozího bodu</span></div><div class="gps-point"><span class="gps-icon ok">✓</span><span>${escapeHtml(nearest.name)}</span></div><div class="gps-message">Už jsem tě našel v tomto místě. Takže teď už to povalíme bílou stopou!</div>`;
  }else{
    el.innerHTML=`<div class="gps-state"><span class="gps-icon away">!</span><span>Nejsi u známého výchozího bodu</span></div><div class="gps-message">Nevadí. Najdu nejbližší výchozí bod a tvoje data pak automaticky správně zařadím.</div>`;
  }
}
async function detectNearestStart(position,areaId){if(!areaId)return null;const{data,error}=await client.from("ski_locations").select("name,latitude,longitude,location_types").eq("area_id",areaId).eq("active",true);if(error||!data?.length)return null;const starts=data.filter(x=>Array.isArray(x.location_types)&&x.location_types.includes("START")&&Number.isFinite(x.latitude)&&Number.isFinite(x.longitude));if(!starts.length)return null;let nearest=null,best=Infinity;for(const x of starts){const d=distanceM(position.coords.latitude,position.coords.longitude,x.latitude,x.longitude);if(d<best){best=d;nearest={...x,distance:Math.round(d)}}}return nearest&&nearest.distance<=1000?nearest:null}
function distanceM(lat1,lon1,lat2,lon2){const r=6371000,p=Math.PI/180,dLat=(lat2-lat1)*p,dLon=(lon2-lon1)*p,a=Math.sin(dLat/2)**2+Math.cos(lat1*p)*Math.cos(lat2*p)*Math.sin(dLon/2)**2;return 2*r*Math.asin(Math.sqrt(a))}
function startTracking(){const button=document.getElementById("start"),status=document.getElementById("startStatus"),animation=document.getElementById("trackAnimation");if(button.disabled||button.dataset.gpsReady!=="true"){status.textContent="Ještě nemám potvrzenou GPS. START je zatím zamčený.";return}button.disabled=true;button.textContent="GPS…";status.textContent="Chytám přesnou polohu a vyrážíme…";navigator.geolocation.getCurrentPosition(async position=>{currentDraft={id:crypto.randomUUID(),startedAt:new Date().toISOString(),synced:false,points:[],startLat:position.coords.latitude,startLon:position.coords.longitude,startAccuracy:position.coords.accuracy,startName:null};saveGpsPoint(currentDraft,position);localStorage.setItem("vestope:groomer:phaseA:draft",JSON.stringify(currentDraft));startGpsWatch(currentDraft);button.disabled=false;button.dataset.gpsReady="true";button.textContent="JEDU";button.classList.remove("stopping","running");button.classList.add("driving");animation.classList.add("active");const nearest=await detectNearestStart(position,currentProfile?.groomer?.default_area_id);currentDraft.startName=nearest?.name||null;renderLocation(document.getElementById("location"),position,nearest);status.className="status running";status.textContent="Jedu s tebou. GPS běží."},error=>{button.disabled=true;button.dataset.gpsReady="false";button.textContent="START";button.classList.remove("driving","stopping","running");status.className="status";status.style.color="#b3261e";if(error.code===1)status.textContent="Přístup k GPS byl zamítnut. Povol GPS v nastavení zařízení.";else if(error.code===2)status.textContent="Poloha není momentálně dostupná. START zůstává zamčený.";else status.textContent="GPS se nepodařilo získat. START zůstává zamčený."},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function startGpsWatch(draft){if(gpsWatchId!==null)navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=navigator.geolocation.watchPosition(position=>{saveGpsPoint(draft,position);localStorage.setItem("vestope:groomer:phaseA:draft",JSON.stringify(draft));const status=document.getElementById("startStatus");if(status)status.textContent=`Jedu s tebou · ${draft.points.length} GPS bodů · přesnost ${Math.round(position.coords.accuracy)} m`},()=>{const status=document.getElementById("startStatus");if(status)status.textContent="Jedu s tebou · GPS signál je momentálně slabý. Data zůstávají v zařízení."},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
function saveGpsPoint(draft,position){draft.points.push({latitude:position.coords.latitude,longitude:position.coords.longitude,accuracy:position.coords.accuracy,speed:position.coords.speed,heading:position.coords.heading,timestamp:new Date(position.timestamp||Date.now()).toISOString()})}
function stopAndOpenForm(){stopTracking();const button=document.getElementById("start");const animation=document.getElementById("trackAnimation");if(button){button.disabled=true;button.textContent="STOP";button.classList.remove("driving","running");button.classList.add("stopping")}if(animation)animation.classList.remove("active");setTimeout(()=>{if(button){button.disabled=false;button.classList.remove("stopping")}openStopForm()},500)}
function stopTracking(){if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null}}
function openStopForm(){const started=currentDraft?.startedAt?new Date(currentDraft.startedAt):new Date();const minutes=Math.max(1,Math.round((Date.now()-started.getTime())/60000));document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="stopModal"><div class="modalCard"><div class="eyebrow">JÍZDA UKONČENA</div><h2>STOP. Dobrá práce.</h2><div class="lead">Ještě mi řekni, jak to dneska vypadalo. Zaznamenal jsem přibližně ${minutes} min · ${currentDraft?.points?.length||0} GPS bodů.</div><form id="stopForm"><div class="formSection"><div class="quality-title">Jaká je podle tebe stopa?</div><div class="quality-grid" id="qualityGrid"><label class="quality-option selected"><input type="radio" name="trackQuality" value="excellent" checked><span class="quality-dot q-excellent"></span><span>Výborná</span></label><label class="quality-option"><input type="radio" name="trackQuality" value="very-good"><span class="quality-dot q-verygood"></span><span>Velmi dobrá</span></label><label class="quality-option"><input type="radio" name="trackQuality" value="passable"><span class="quality-dot q-passable"></span><span>Sjízdné</span></label><label class="quality-option"><input type="radio" name="trackQuality" value="limited"><span class="quality-dot q-limited"></span><span>Sjízdné s většími omezeními</span></label><label class="quality-option"><input type="radio" name="trackQuality" value="bad"><span class="quality-dot q-bad"></span><span>Nesjízdné</span></label></div></div><div class="formSection"><h3>Sněhové podmínky</h3><div class="sectionHint">Můžeš vybrat jednu i více možností.</div><div class="check-grid"><label class="check-option"><input type="checkbox" name="snowCondition" value="powder">Prachový sníh</label><label class="check-option"><input type="checkbox" name="snowCondition" value="soft">Měkká bořivá stopa</label><label class="check-option"><input type="checkbox" name="snowCondition" value="wet-heavy">Mokrý těžký sníh</label><label class="check-option"><input type="checkbox" name="snowCondition" value="icy-fast">Zledovatělá rychlá stopa</label><label class="check-option"><input type="checkbox" name="snowCondition" value="lightly-dirty">Málo znečištěná stopa</label><label class="check-option"><input type="checkbox" name="snowCondition" value="heavily-dirty">Silně znečištěná stopa</label><label class="check-option"><input type="checkbox" name="snowCondition" value="firn">Starý jarní firn</label><label class="check-option"><input type="checkbox" name="snowCondition" value="technical">Technický umělý sníh</label></div></div><div class="formSection"><div class="sectionHeader"><div class="trackTypeIcon" aria-hidden="true"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="12" r="3" fill="white" stroke="none"/><path d="M22 17v15l-8 12m8-12 9 7m-9-4 10 13M42 12a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/><path d="M42 19v14l-7 12m7-12 9 6m-9-3 9 13M7 50h20m7 0h23"/></g></svg></div><h3>Druh stopy</h3></div><div class="sectionHint">Vyber, co je dnes upravené.</div><div class="check-grid"><label class="check-option"><input type="checkbox" name="trackType" value="classic">Klasika</label><label class="check-option"><input type="checkbox" name="trackType" value="skate">Skate (bruslení)</label></div></div><div class="formSection"><label for="note">Poznámka <span style="font-weight:400;color:#8a96a5">(nepovinné)</span></label><textarea id="note" placeholder="Třeba: mezi Brunstem a Můstkem fouká…"></textarea></div><div class="formActions"><button type="button" class="cancel" id="cancelStop">Zpět</button><button class="save">Uložit jízdu</button></div></form></div></div>`);document.querySelectorAll('#qualityGrid input[name="trackQuality"]').forEach(input=>input.addEventListener('change',()=>{document.querySelectorAll('#qualityGrid .quality-option').forEach(x=>x.classList.toggle('selected',x.contains(input)&&input.checked))}));document.getElementById("cancelStop").addEventListener("click",()=>{document.getElementById("stopModal")?.remove();currentDraft=null;homeView(currentProfile.user,currentProfile.groomer)});document.getElementById("stopForm").addEventListener("submit",saveRide)}
const thanks={"fresh-snow":["To je ono! Čerstvý sníh a krásná stopa. Díky za dnešní práci!","Paráda. Čerstvý sníh je rozjetý a stopa čeká na běžkaře. Díky!"],"deep-cold":["Mráz pořádně přituhnul, ale stopa drží. Dobrá práce!","Když mrzne, až praští, musí být stopa jak má být. Díky!"],"good":["Stopa je připravená. Běžkaři budou mít radost. Díky!","Dobrá práce. Další kus bílé stopy je hotový!"],"wet":["I v tomhle sněhu se to počítá. Díky za každou upravenou stopu!","Těžký sníh, těžší práce. O to větší díky!"],"difficult":["Málo sněhu, ale udělal jsi maximum. Díky za bílou stopu!","Podmínky dnes nebyly jednoduché, ale stopa je připravená. Díky!"]};
function saveRide(e){e.preventDefault();const quality=document.querySelector('input[name="trackQuality"]:checked')?.value||"excellent";const snowConditions=[...document.querySelectorAll('input[name="snowCondition"]:checked')].map(x=>x.value);const trackTypes=[...document.querySelectorAll('input[name="trackType"]:checked')].map(x=>x.value);const record={...currentDraft,endedAt:new Date().toISOString(),synced:false,questionnaire:{trackQuality:quality,snowConditions,trackTypes,note:document.getElementById("note").value.trim()}};const rides=JSON.parse(localStorage.getItem("vestope:groomer:rides")||"[]");rides.push(record);localStorage.setItem("vestope:groomer:rides",JSON.stringify(rides));localStorage.removeItem("vestope:groomer:phaseA:draft");currentDraft=null;document.getElementById("stopModal")?.remove();showThanks(quality)}
function showThanks(condition){const pool=thanks[condition]||thanks.good;const message=pool[Math.floor(Math.random()*pool.length)];app.innerHTML=`<section class="card thanks"><div class="thanksIcon">❄️</div><div class="eyebrow">HOTOVO</div><h2>Dobrá práce!</h2><p>${escapeHtml(message)}</p><div class="small">Jízda je uložená v zařízení a čeká na synchronizaci.</div><button class="primary" id="again" style="margin-top:22px">Další jízda</button><div class="account"><span>${escapeHtml(currentProfile?.groomer?.name||"Rolbař")}</span><button id="logoutThanks" class="secondary">Odhlásit</button></div></section>`;document.getElementById("again").addEventListener("click",()=>homeView(currentProfile.user,currentProfile.groomer));document.getElementById("logoutThanks").addEventListener("click",async()=>{await client.auth.signOut();loginView()})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
(async()=>{if("serviceWorker"in navigator){try{await navigator.serviceWorker.register("./sw.js")}catch(e){console.warn("SW",e)}}const profile=await getAuthorizedProfile();if(profile)homeView(profile.user,profile.groomer);else loginView()})();
</script></body></html>

<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b63ce">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./logo_vestope.cz.png">
<title>VeStope.cz – Rolbař</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#132238;background:#edf5fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf5fc}body{min-height:100vh;overflow:hidden}.winter{position:fixed;inset:0;z-index:0;background:#edf5fc url("./vestope-groomer-background.webp") center/cover no-repeat}.app{position:relative;z-index:1;width:min(100%,560px);min-height:100vh;margin:auto;padding:22px 18px 24px;display:flex;flex-direction:column}.topbar{display:flex;justify-content:flex-end;align-items:center;height:34px}.pill{font-size:12px;font-weight:700;border-radius:999px;padding:7px 11px;background:rgba(255,255,255,.9);border:1px solid rgba(19,34,56,.08);box-shadow:0 3px 12px rgba(35,74,110,.08)}.online{color:#137333}.online:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#21b85a;margin-right:6px}.offline{color:#a54800}.offline:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#e17b28;margin-right:6px}main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 0}.card{width:100%;max-width:470px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:28px 30px 24px;box-shadow:0 18px 55px rgba(44,85,125,.16);backdrop-filter:blur(10px)}.logo{display:block;width:min(230px,68%);height:auto;margin:0 auto 16px}.eyebrow{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#718096;font-weight:700;margin-bottom:8px}h1{text-align:center;font-size:30px;line-height:1.1;margin:0 0 10px;letter-spacing:-.03em;color:#142b4b}p{text-align:center;color:#68778a;line-height:1.5;margin:0 auto;max-width:370px}.login{margin-top:24px}label{display:block;font-size:13px;font-weight:700;color:#34445a;margin:15px 0 6px}input{width:100%;padding:14px 15px;border:1px solid #d8e1eb;border-radius:13px;background:#fff;font-size:16px;color:#16283f;outline:none;transition:border-color .15s,box-shadow .15s}input:focus{border-color:#4b8fe8;box-shadow:0 0 0 3px rgba(11,99,206,.11)}.primary{width:100%;margin-top:20px;border:0;background:#0b63ce;color:#fff;padding:15px;border-radius:13px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(11,99,206,.2)}.primary:disabled{opacity:.65;cursor:default}.error{margin-top:12px;color:#b3261e;font-size:13px;text-align:center}.small{font-size:12px;color:#7a8798;text-align:center;margin-top:14px}.footer{text-align:center;color:#77869a;font-size:12px;padding:8px 0 2px}.homeCard{padding-bottom:30px}.start{width:190px;height:190px;border-radius:50%;border:0;background:#0b63ce;color:#fff;font-size:24px;font-weight:800;margin:38px auto 25px;box-shadow:0 14px 35px rgba(11,99,206,.25);cursor:pointer;display:block}.start.running{background:#c63b2e}.status{text-align:center;font-size:14px;color:#687587}.user{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#657185}.secondary{border:1px solid #d9e1eb;background:#fff;color:#243246;border-radius:11px;padding:9px 12px;cursor:pointer}@media(max-width:600px){.app{padding:16px 12px 18px}.card{padding:23px 20px 20px;border-radius:22px}.logo{width:205px}h1{font-size:27px}.start{width:170px;height:170px}}
</style>
</head>
<body><div class="winter" aria-hidden="true"></div><div class="app"><div class="topbar"><div id="connection" class="pill">Kontroluji…</div></div><main id="app"></main><div class="footer">VeStope.cz – Evidence a monitoring rolbařů</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://wlxrqqtvpqumvbbdfpuv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_aXH1aT3OZN2p0mMzfWLt0w_YGFBFaQl";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const app=document.getElementById("app"),connection=document.getElementById("connection");
function updateConnection(){const online=navigator.onLine;connection.textContent=online?"ONLINE":"OFFLINE";connection.className="pill "+(online?"online":"offline")}
addEventListener("online",updateConnection);addEventListener("offline",updateConnection);updateConnection();
function loginView(message=""){app.innerHTML=`<section class="card"><img class="logo" src="./logo_vestope.cz.png" alt="VeStope.cz"><div class="eyebrow">TESTOVACÍ PROSTŘEDÍ</div><h1>Rolbař</h1><p>Přihlášení se na tomto zařízení zapamatuje.</p><form id="loginForm" class="login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Heslo</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">Přihlásit</button>${message?`<div class="error">${message}</div>`:""}</form><div class="small">Fáze A · přihlášení, persistentní relace a základ offline režimu.</div></section>`;document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;b.textContent="Přihlašuji…";const{error}=await client.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error){loginView(error.message);return}homeView()})}
async function homeView(){const{data}=await client.auth.getUser(),user=data?.user;app.innerHTML=`<section class="card homeCard"><img class="logo" src="./logo_vestope.cz.png" alt="VeStope.cz"><div class="eyebrow">TESTOVACÍ VERZE</div><h1>Připraveno?</h1><p>Aplikace je připravena zaznamenat jízdu rolbaře.</p><button id="start" class="start">START</button><div id="startStatus" class="status">Jízda zatím není spuštěná.</div></section><div class="user"><span>${escapeHtml(user?.email||"Rolbař")}</span><button id="logout" class="secondary">Odhlásit</button></div>`;document.getElementById("start").addEventListener("click",startDraft);document.getElementById("logout").addEventListener("click",async()=>{await client.auth.signOut();loginView()})}
function startDraft(){const draft={id:crypto.randomUUID(),startedAt:new Date().toISOString(),synced:false};localStorage.setItem("vestope:groomer:phaseA:draft",JSON.stringify(draft));const b=document.getElementById("start");b.classList.add("running");b.textContent="BĚŽÍ";document.getElementById("startStatus").textContent="Testovací jízda je uložena lokálně v zařízení."}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
(async()=>{if("serviceWorker"in navigator){try{await navigator.serviceWorker.register("./sw.js")}catch(e){console.warn("SW",e)}}const{data}=await client.auth.getSession();if(data?.session)homeView();else loginView()})();
</script></body></html>

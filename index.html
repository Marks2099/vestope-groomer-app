<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b63ce">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./logo_vestope.cz.png">
<title>VeStope.cz – Rolbař</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#132238;background:#edf5fc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf5fc}body{min-height:100vh;overflow-x:hidden}
.winter{position:fixed;inset:0;z-index:0;background:#edf5fc url("./vestope-groomer-background.webp") center/cover no-repeat}
.app{position:relative;z-index:1;width:100%;max-width:560px;min-height:100vh;margin:auto;padding:16px 14px 18px;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:flex-end;align-items:center;height:34px;flex-shrink:0}.pill{font-size:13px;font-weight:800;border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.96);border:1px solid rgba(19,34,56,.08);box-shadow:0 4px 14px rgba(35,74,110,.12)}
.online{color:#137333}.online:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#21b85a;margin-right:7px}.offline{color:#a54800}.offline:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#e17b28;margin-right:7px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0}.card{width:100%;max-width:470px;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:28px 30px 24px;box-shadow:0 18px 55px rgba(44,85,125,.16);backdrop-filter:blur(10px)}
.logo{display:block;width:min(230px,68%);height:auto;margin:0 auto 16px}.eyebrow{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#718096;font-weight:700;margin-bottom:8px}h1{text-align:center;font-size:30px;line-height:1.1;margin:0 0 10px;letter-spacing:-.03em;color:#142b4b}p{text-align:center;color:#68778a;line-height:1.5;margin:0 auto;max-width:370px}
.login{margin-top:24px}label{display:block;font-size:13px;font-weight:700;color:#34445a;margin:15px 0 6px}input,select,textarea{width:100%;padding:14px 15px;border:1px solid #d8e1eb;border-radius:13px;background:#fff;font-size:16px;color:#16283f;outline:none;font-family:inherit}textarea{min-height:90px;resize:vertical}.primary{width:100%;margin-top:20px;border:0;background:#0b63ce;color:#fff;padding:15px;border-radius:13px;font-size:16px;font-weight:800;cursor:pointer}.primary:disabled{opacity:.65}.error{margin-top:12px;color:#b3261e;font-size:13px;text-align:center}.small{font-size:12px;color:#7a8798;text-align:center;margin-top:14px}
.homeCard{padding-bottom:18px}.gpsbox{margin:12px auto 0;padding:12px 14px;border-radius:15px;background:#f3f8fc;border:1px solid #dfeaf3;text-align:center;color:#40546c;font-size:14px}.gpsbox strong{color:#163c65}.gpscoords{font-size:11px;color:#8290a0;margin-top:4px}.gpsok{color:#137333;font-weight:800}.gpswait{color:#718096}.gpserror{color:#b3261e}
.start{width:190px;height:190px;border-radius:50%;border:0;background:#20a84b;color:#fff;font-size:24px;font-weight:900;margin:28px auto 16px;box-shadow:0 14px 35px rgba(32,168,75,.25);cursor:pointer;display:block;transition:transform .12s,background .15s,box-shadow .15s}.start:hover{transform:translateY(-1px)}.start:disabled{opacity:.75;cursor:default}.start.running{background:#20a84b;box-shadow:0 14px 35px rgba(32,168,75,.28)}
.status{text-align:center;font-size:14px;color:#687587;min-height:22px}.status.running{color:#1769aa;font-weight:700}.location{margin:10px auto 0;padding:11px 14px;border-radius:14px;background:#f3f8fc;border:1px solid #e1eaf2;text-align:center;color:#40546c;font-size:14px}.location strong{color:#163c65}
.track-animation{display:none;position:relative;height:92px;margin:8px 0 0;overflow:hidden;border-radius:14px;background:linear-gradient(#f9fcff,#edf7fc)}.track-animation.active{display:block}.track-base{position:absolute;left:4%;right:4%;top:59px;height:18px;border-radius:50%;background:repeating-linear-gradient(0deg,#e8eef2 0,#e8eef2 3px,#f9fcff 3px,#f9fcff 6px);box-shadow:inset 0 2px 5px rgba(120,150,175,.12)}.track-done{position:absolute;left:3%;top:55px;width:0;height:24px;border-radius:40%;background:repeating-linear-gradient(0deg,#d9e9f4 0,#d9e9f4 3px,#fff 3px,#fff 6px);box-shadow:0 2px 8px rgba(80,110,140,.15);animation:grooming 5.5s linear infinite}.groomer{position:absolute;top:9px;left:2%;width:74px;height:50px;object-fit:contain;animation:driving 5.5s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(30,55,75,.15))}.snow{position:absolute;left:7%;top:72px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.85;box-shadow:18px 0 #fff,36px 0 #fff,54px 0 #fff,72px 0 #fff;animation:snowmove 5.5s linear infinite}@keyframes driving{0%{left:2%}100%{left:84%}}@keyframes grooming{0%{width:0}100%{width:91%}}@keyframes snowmove{0%{transform:translateX(0);opacity:.1}20%{opacity:.9}100%{transform:translateX(55px);opacity:0}}
.account{margin:16px auto 0;padding-top:13px;border-top:1px solid #e5ebf1;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:#657185;font-size:13px;text-align:center}.secondary{border:1px solid #d9e1eb;background:#fff;color:#243246;border-radius:11px;padding:9px 14px;cursor:pointer;font-weight:600}.footer{text-align:center;color:#77869a;font-size:12px;padding:2px 0 0;flex-shrink:0}
.modal{position:fixed;inset:0;z-index:20;background:rgba(17,35,54,.42);display:flex;align-items:center;justify-content:center;padding:18px}.modalCard{width:100%;max-width:460px;max-height:calc(100vh - 36px);overflow:auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(15,35,55,.25)}.modalCard h2{text-align:center;margin:0 0 6px;color:#142b4b}.modalCard .lead{text-align:center;font-size:14px;color:#6d7d90;margin-bottom:14px}.formActions{display:flex;gap:10px;margin-top:18px}.formActions button{flex:1;padding:13px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer}.cancel{border:1px solid #d9e1eb;background:#fff;color:#34445a}.save{border:0;background:#0b63ce;color:#fff}.thanks{text-align:center;padding:20px 8px}.thanksIcon{font-size:42px}.thanks h2{font-size:25px;margin:10px 0 8px}.thanks p{max-width:360px}.thanks .small{margin-top:16px}
@media(max-width:600px){.app{padding:12px 10px 14px}.topbar{height:48px;justify-content:center;align-items:flex-start;padding-top:2px}.pill{font-size:13px;padding:9px 14px}.card{max-width:470px;padding:22px 18px 18px;border-radius:22px}.logo{width:205px}h1{font-size:27px}.start{width:170px;height:170px;margin-top:24px}.track-animation{margin-left:0;margin-right:0}.account{margin-top:14px;padding-top:12px}.footer{margin-top:4px}}
@media(max-height:760px) and (max-width:600px){main{padding:8px 0}.card{padding-top:18px}.logo{width:175px;margin-bottom:10px}.start{width:145px;height:145px;margin-top:16px;margin-bottom:10px}.track-animation{height:60px}.track-base,.track-done{top:36px}.groomer{top:2px}.snow{top:49px}}
@media(prefers-reduced-motion:reduce){.groomer,.track-done,.snow{animation:none}.track-done{width:91%}.groomer{left:84%}}
</style>
</head>
<body>
<div class="winter" aria-hidden="true"></div>
<div class="app"><div class="topbar"><div id="connection" class="pill">Kontroluji…</div></div><main id="app"></main><div class="footer">VeStope.cz – Evidence a monitoring rolbařů</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://wlxrqqtvpqumvbbdfpuv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_aXH1aT3OZN2p0mMzfWLt0w_YGFBFaQl";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const app=document.getElementById("app"),connection=document.getElementById("connection");let gpsWatchId=null,currentDraft=null,currentProfile=null;
function updateConnection(){const online=navigator.onLine;connection.textContent=online?"ONLINE":"OFFLINE";connection.className="pill "+(online?"online":"offline")}addEventListener("online",updateConnection);addEventListener("offline",updateConnection);updateConnection();
async function getAuthorizedProfile(){const{data:{session}}=await client.auth.getSession();if(!session)return null;const{data:userData}=await client.auth.getUser();const user=userData?.user;if(!user)return null;const{data:groomer}=await client.from("groomers").select("name,email,role,active,default_area_id").eq("user_id",user.id).eq("active",true).maybeSingle();if(!groomer){await client.auth.signOut();return null}return{user,groomer}}
function loginView(message=""){app.innerHTML=`<section class="card"><img class="logo" src="./logo_vestope.cz.png" alt="VeStope.cz"><div class="eyebrow">TESTOVACÍ PROSTŘEDÍ</div><h1>Rolbař</h1><p>Přístup mají pouze schválení rolbaři.</p><form id="loginForm" class="login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Heslo</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">Přihlásit</button>${message?`<div class="error">${message}</div>`:""}</form><div class="small">Přístup do aplikace vytváří správce VeStope.cz.</div></section>`;document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;b.textContent="Přihlašuji…";const{data,error}=await client.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error){loginView("Nesprávný e-mail nebo heslo.");return}const{data:groomer,error:gError}=await client.from("groomers").select("name,email,role,active,default_area_id").eq("user_id",data.user.id).eq("active",true).maybeSingle();if(gError||!groomer){await client.auth.signOut();loginView("Tento účet nemá schválený přístup do aplikace.");return}homeView(data.user,groomer)})}
function homeView(user,groomer){currentProfile={user,groomer};app.innerHTML=`<section class="card homeCard"><img class="logo" src="./logo_vestope.cz.png" alt="VeStope.cz"><div class="eyebrow">TESTOVACÍ VERZE</div><h1>Připraveno?</h1><p>Já jsem připravený. Můžeme vyrazit?</p><div id="location" class="gpsbox"><span class="gpswait">📍 Mrknu, kde právě jsi…</span></div><button id="start" class="start">START</button><div id="trackAnimation" class="track-animation" aria-hidden="true"><div class="track-base"></div><div class="track-done"></div><img class="groomer" src="./groomer.svg" alt="Sněžná rolba"><div class="snow"></div></div><div id="startStatus" class="status">GPS se připravuje.</div><div class="account"><span>${escapeHtml(groomer?.name||user?.email||"Rolbař")}</span><button id="logout" class="secondary">Odhlásit</button></div></section>`;document.getElementById("start").addEventListener("click",()=>currentDraft?stopAndOpenForm():startTracking());document.getElementById("logout").addEventListener("click",async()=>{stopTracking();currentDraft=null;await client.auth.signOut();loginView()});requestInitialLocation(groomer?.default_area_id)}
async function requestInitialLocation(areaId){const el=document.getElementById("location"),status=document.getElementById("startStatus");if(!navigator.geolocation){el.innerHTML='<span class="gpserror">GPS toto zařízení nepodporuje.</span>';return}status.textContent="Mrknu na GPS…";navigator.geolocation.getCurrentPosition(async position=>{const nearest=await detectNearestStart(position,areaId);renderLocation(el,position,nearest);status.innerHTML='<span class="gpsok">Vidím tě. Můžeš vyrazit.</span>'},error=>{el.innerHTML='<span class="gpserror">📍 GPS zatím nevidím.</span><br><span style="font-size:12px;color:#8290a0">Po stisknutí START to zkusíme znovu.</span>';status.textContent="GPS zatím není připravené."},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}
function renderLocation(el,position,nearest){const lat=position.coords.latitude.toFixed(5),lon=position.coords.longitude.toFixed(5);if(nearest){el.innerHTML=`📍 <strong>${escapeHtml(nearest.name)}</strong><br><span style="font-size:12px">Vidím tě ${nearest.distance} m od výchozího bodu.</span><div class="gpscoords">${lat}, ${lon} · přesnost ${Math.round(position.coords.accuracy)} m</div>`}else{el.innerHTML=`📍 <strong>Mimo známé výchoziště</strong><br><span style="font-size:12px">Tvoje poloha: ${lat}, ${lon}</span><div class="gpscoords">přesnost ${Math.round(position.coords.accuracy)} m</div>`}}
async function detectNearestStart(position,areaId){if(!areaId)return null;const{data,error}=await client.from("ski_locations").select("name,latitude,longitude,location_types").eq("area_id",areaId).eq("active",true);if(error||!data?.length)return null;const starts=data.filter(x=>Array.isArray(x.location_types)&&x.location_types.includes("START")&&Number.isFinite(x.latitude)&&Number.isFinite(x.longitude));if(!starts.length)return null;let nearest=null,best=Infinity;for(const x of starts){const d=distanceM(position.coords.latitude,position.coords.longitude,x.latitude,x.longitude);if(d<best){best=d;nearest={...x,distance:Math.round(d)}}}return nearest&&nearest.distance<=1000?nearest:null}
function distanceM(lat1,lon1,lat2,lon2){const r=6371000,p=Math.PI/180,dLat=(lat2-lat1)*p,dLon=(lon2-lon1)*p,a=Math.sin(dLat/2)**2+Math.cos(lat1*p)*Math.cos(lat2*p)*Math.sin(dLon/2)**2;return 2*r*Math.asin(Math.sqrt(a))}
function startTracking(){const button=document.getElementById("start"),status=document.getElementById("startStatus"),animation=document.getElementById("trackAnimation");if(!navigator.geolocation){status.textContent="Toto zařízení nepodporuje získání polohy.";status.style.color="#b3261e";return}button.disabled=true;button.textContent="GPS…";status.textContent="Chytám GPS a vyrážíme…";navigator.geolocation.getCurrentPosition(async position=>{currentDraft={id:crypto.randomUUID(),startedAt:new Date().toISOString(),synced:false,points:[],startLat:position.coords.latitude,startLon:position.coords.longitude,startAccuracy:position.coords.accuracy,startName:null};saveGpsPoint(currentDraft,position);localStorage.setItem("vestope:groomer:phaseA:draft",JSON.stringify(currentDraft));startGpsWatch(currentDraft);button.disabled=false;button.textContent="STOP";animation.classList.add("active");const nearest=await detectNearestStart(position,currentProfile?.groomer?.default_area_id);currentDraft.startName=nearest?.name||null;renderLocation(document.getElementById("location"),position,nearest);status.className="status running";status.textContent=`Jedu s tebou · GPS aktivní · ${Math.round(position.coords.accuracy)} m`},error=>{button.disabled=false;button.textContent="START";status.className="status";status.style.color="#b3261e";if(error.code===1)status.textContent="Přístup k GPS byl zamítnut. Povol GPS v nastavení zařízení/prohlížeče.";else if(error.code===2)status.textContent="Poloha není momentálně dostupná. Zkus START znovu.";else status.textContent="GPS se nepodařilo získat včas. Zkus START znovu."},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function startGpsWatch(draft){if(gpsWatchId!==null)navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=navigator.geolocation.watchPosition(position=>{saveGpsPoint(draft,position);localStorage.setItem("vestope:groomer:phaseA:draft",JSON.stringify(draft));const status=document.getElementById("startStatus");if(status)status.textContent=`Jedu s tebou · ${draft.points.length} GPS bodů · přesnost ${Math.round(position.coords.accuracy)} m`},()=>{const status=document.getElementById("startStatus");if(status)status.textContent="Jedu s tebou · GPS signál je momentálně slabý. Data zůstávají v zařízení."},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
function saveGpsPoint(draft,position){draft.points.push({latitude:position.coords.latitude,longitude:position.coords.longitude,accuracy:position.coords.accuracy,speed:position.coords.speed,heading:position.coords.heading,timestamp:new Date(position.timestamp||Date.now()).toISOString()})}
function stopAndOpenForm(){stopTracking();const button=document.getElementById("start");if(button){button.disabled=true;button.textContent="STOP"}setTimeout(()=>{if(button)button.disabled=false;openStopForm()},350)}
function stopTracking(){if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null}}
function openStopForm(){const started=currentDraft?.startedAt?new Date(currentDraft.startedAt):new Date();const minutes=Math.max(1,Math.round((Date.now()-started.getTime())/60000));document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="stopModal"><div class="modalCard"><div class="eyebrow">JÍZDA UKONČENA</div><h2>STOP. Dobrá práce.</h2><div class="lead">Ještě mi řekni, jak to dneska vypadalo. Zaznamenal jsem přibližně ${minutes} min · ${currentDraft?.points?.length||0} GPS bodů.</div><form id="stopForm"><label for="snow">Jaké byly podmínky?</label><select id="snow"><option value="fresh-snow">Čerstvý sníh, paráda</option><option value="deep-cold">Mráz a tvrdá stopa</option><option value="good">Dobré podmínky</option><option value="wet">Těžší / mokřejší sníh</option><option value="difficult">Méně sněhu / horší podmínky</option></select><label for="trackQuality">Jaká je stopa?</label><select id="trackQuality"><option>Výborná</option><option>Dobrá</option><option>Ujde to</option><option>Potřebuje ještě péči</option></select><label for="note">Poznámka <span style="font-weight:400;color:#8a96a5">(nepovinné)</span></label><textarea id="note" placeholder="Třeba: mezi Brunstem a Můstkem fouká…"></textarea><div class="formActions"><button type="button" class="cancel" id="cancelStop">Zpět</button><button class="save">Uložit jízdu</button></div></form></div></div>`);document.getElementById("cancelStop").addEventListener("click",()=>{document.getElementById("stopModal")?.remove();currentDraft=null;homeView(currentProfile.user,currentProfile.groomer)});document.getElementById("stopForm").addEventListener("submit",saveRide)}
const thanks={"fresh-snow":["To je ono! Čerstvý sníh a krásná stopa. Díky za dnešní práci!","Paráda. Čerstvý sníh je rozjetý a stopa čeká na běžkaře. Díky!"],"deep-cold":["Mráz pořádně přituhnul, ale stopa drží. Dobrá práce!","Když mrzne, až praští, musí být stopa jak má být. Díky!"],"good":["Stopa je připravená. Běžkaři budou mít radost. Díky!","Dobrá práce. Další kus bílé stopy je hotový!"],"wet":["I v tomhle sněhu se to počítá. Díky za každou upravenou stopu!","Těžký sníh, těžší práce. O to větší díky!"],"difficult":["Málo sněhu, ale udělal jsi maximum. Díky za bílou stopu!","Podmínky dnes nebyly jednoduché, ale stopa je připravená. Díky!"]};
function saveRide(e){e.preventDefault();const condition=document.getElementById("snow").value,record={...currentDraft,endedAt:new Date().toISOString(),synced:false,questionnaire:{conditions:condition,trackQuality:document.getElementById("trackQuality").value,note:document.getElementById("note").value.trim()}};const rides=JSON.parse(localStorage.getItem("vestope:groomer:rides")||"[]");rides.push(record);localStorage.setItem("vestope:groomer:rides",JSON.stringify(rides));localStorage.removeItem("vestope:groomer:phaseA:draft");currentDraft=null;document.getElementById("stopModal")?.remove();showThanks(condition)}
function showThanks(condition){const pool=thanks[condition]||thanks.good;const message=pool[Math.floor(Math.random()*pool.length)];app.innerHTML=`<section class="card thanks"><div class="thanksIcon">❄️</div><div class="eyebrow">HOTOVO</div><h2>Dobrá práce!</h2><p>${escapeHtml(message)}</p><div class="small">Jízda je uložená v zařízení a čeká na synchronizaci.</div><button class="primary" id="again" style="margin-top:22px">Další jízda</button><div class="account"><span>${escapeHtml(currentProfile?.groomer?.name||"Rolbař")}</span><button id="logoutThanks" class="secondary">Odhlásit</button></div></section>`;document.getElementById("again").addEventListener("click",()=>homeView(currentProfile.user,currentProfile.groomer));document.getElementById("logoutThanks").addEventListener("click",async()=>{await client.auth.signOut();loginView()})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
(async()=>{if("serviceWorker"in navigator){try{await navigator.serviceWorker.register("./sw.js")}catch(e){console.warn("SW",e)}}const profile=await getAuthorizedProfile();if(profile)homeView(profile.user,profile.groomer);else loginView()})();
</script></body></html>

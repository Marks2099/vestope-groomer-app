<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b63ce">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./logo_vestope.cz.png">
<title>VeStope.cz – Rolbař</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#132238;background:#edf5fc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#edf5fc}
body{min-height:100vh;overflow-x:hidden}
.winter{position:fixed;inset:0;z-index:0;background:#edf5fc url("./vestope-groomer-background.webp") center/cover no-repeat}
.app{position:relative;z-index:1;width:100%;max-width:560px;min-height:100vh;margin:auto;padding:16px 14px 18px;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:flex-end;align-items:center;height:34px;flex-shrink:0}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:7px 11px;background:rgba(255,255,255,.92);border:1px solid rgba(19,34,56,.08);box-shadow:0 3px 12px rgba(35,74,110,.08)}
.online{color:#137333}.online:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#21b85a;margin-right:6px}
.offline{color:#a54800}.offline:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#e17b28;margin-right:6px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0}
.card{width:100%;max-width:470px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:28px 30px 24px;box-shadow:0 18px 55px rgba(44,85,125,.16);backdrop-filter:blur(10px)}
.logo{display:block;width:min(230px,68%);height:auto;margin:0 auto 16px}
.eyebrow{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#718096;font-weight:700;margin-bottom:8px}
h1{text-align:center;font-size:30px;line-height:1.1;margin:0 0 10px;letter-spacing:-.03em;color:#142b4b}
p{text-align:center;color:#68778a;line-height:1.5;margin:0 auto;max-width:370px}
.login{margin-top:24px}label{display:block;font-size:13px;font-weight:700;color:#34445a;margin:15px 0 6px}
input{width:100%;padding:14px 15px;border:1px solid #d8e1eb;border-radius:13px;background:#fff;font-size:16px;color:#16283f;outline:none}
.primary{width:100%;margin-top:20px;border:0;background:#0b63ce;color:#fff;padding:15px;border-radius:13px;font-size:16px;font-weight:800;cursor:pointer}
.primary:disabled{opacity:.65}.error{margin-top:12px;color:#b3261e;font-size:13px;text-align:center}.small{font-size:12px;color:#7a8798;text-align:center;margin-top:14px}
.homeCard{padding-bottom:22px}
.start{width:190px;height:190px;border-radius:50%;border:0;background:#20a84b;color:#fff;font-size:24px;font-weight:800;margin:30px auto 20px;box-shadow:0 14px 35px rgba(32,168,75,.25);cursor:pointer;display:block;transition:transform .12s,background .15s,box-shadow .15s}
.start:hover{transform:translateY(-1px)}.start:disabled{opacity:.75;cursor:default}.start.running{background:#c63b2e;box-shadow:0 14px 35px rgba(198,59,46,.25)}
.status{text-align:center;font-size:14px;color:#687587;min-height:22px}
.location{margin:10px auto 0;padding:11px 14px;border-radius:14px;background:#f3f8fc;border:1px solid #e1eaf2;text-align:center;color:#40546c;font-size:14px}.location strong{color:#163c65}
.track-animation{display:none;position:relative;height:70px;margin:10px 8px 0;overflow:hidden}.track-animation.active{display:block}
.track-base{position:absolute;left:7%;right:7%;top:37px;height:6px;border-radius:999px;background:#d7e0e8}
.track-done{position:absolute;left:7%;top:37px;width:0;height:6px;border-radius:999px;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.5),0 2px 8px rgba(80,110,140,.2);animation:grooming 4.8s linear infinite}
.groomer{position:absolute;top:8px;left:5%;width:46px;height:46px;object-fit:contain;animation:driving 4.8s ease-in-out infinite}
.snow{position:absolute;left:6%;top:48px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.8;box-shadow:18px 0 #fff,36px 0 #fff,54px 0 #fff;animation:snowmove 4.8s linear infinite}
@keyframes driving{0%{left:5%}100%{left:86%}}@keyframes grooming{0%{width:0}100%{width:82%}}@keyframes snowmove{0%{transform:translateX(0);opacity:.1}20%{opacity:.9}100%{transform:translateX(40px);opacity:0}}
.account{margin:18px auto 0;padding-top:14px;border-top:1px solid #e5ebf1;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:#657185;font-size:13px;text-align:center}
.secondary{border:1px solid #d9e1eb;background:#fff;color:#243246;border-radius:11px;padding:9px 14px;cursor:pointer;font-weight:600}
.footer{text-align:center;color:#77869a;font-size:12px;padding:2px 0 0;flex-shrink:0}
@media(max-width:600px){.app{padding:12px 10px 14px}.topbar{height:32px}.card{max-width:470px;padding:22px 18px 20px;border-radius:22px}.logo{width:205px}h1{font-size:27px}.start{width:170px;height:170px;margin-top:26px}.track-animation{margin-left:0;margin-right:0}.account{margin-top:15px;padding-top:12px}}
@media(max-height:760px) and (max-width:600px){main{padding:8px 0}.card{padding-top:18px}.logo{width:175px;margin-bottom:10px}.start{width:145px;height:145px;margin-top:18px;margin-bottom:12px}.track-animation{height:55px}.track-base,.track-done{top:29px}.groomer{top:2px}.snow{top:40px}}
@media(prefers-reduced-motion:reduce){.groomer,.track-done,.snow{animation:none}.track-done{width:82%}.groomer{left:86%}}
</style>
</head>
<body>
<div class="winter" aria-hidden="true"></div>
<div class="app">
  <div class="topbar"><div id="connection" class="pill">Kontroluji…</div></div>
  <main id="app"></main>
  <div class="footer">VeStope.cz – Evidence a monitoring rolbařů</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://wlxrqqtvpqumvbbdfpuv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_aXH1aT3OZN2p0mMzfWLt0w_YGFBFaQl";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const app=document.getElementById("app"),connection=document.getElementById("connection");
let gpsWatchId=null;
function updateConnection(){const online=navigator.onLine;connection.textContent=online?"ONLINE":"OFFLINE";connection.className="pill "+(online?"online":"offline")}
addEventListener("online",updateConnection);addEventListener("offline",updateConnection);updateConnection();
async function getAuthorizedProfile(){const{data:{session}}=await client.auth.getSession();if(!session)return null;const{data:userData}=await client.auth.getUser();const user=userData?.user;if(!user)return null;const{data:groomer}=await client.from("groomers").select("name,email,role,active,default_area_id").eq("user_id",user.id).eq("active",true).maybeSingle();if(!groomer){await client.auth.signOut();return null}return{user,groomer}}
function loginView(message=""){app.innerHTML=`<section class="card"><img class="logo" src="./logo_vestope.cz.png" alt="VeStope.cz"><div class="eyebrow">TESTOVACÍ PROSTŘEDÍ</div><h1>Rolbař</h1><p>Přístup mají pouze schválení rolbaři.</p><form id="loginForm" class="login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Heslo</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">Přihlásit</button>${message?`<div class="error">${message}</div>`:""}</form><div class="small">Přístup do aplikace vytváří správce VeStope.cz.</div></section>`;document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;b.textContent="Přihlašuji…";const{data,error}=await client.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error){loginView("Nesprávný e-mail nebo heslo.");return}const{data:groomer,error:gError}=await client.from("groomers").select("name,email,role,active,default_area_id").eq("user_id",data.user.id).eq("active",true).maybeSingle();if(gError||!groomer){await client.auth.signOut();loginView("Tento účet nemá schválený přístup do aplikace.");return}homeView(data.user,groomer)})}
function homeView(user,groomer){app.innerHTML=`<section class="card homeCard"><img class="logo" src="./logo_vestope.cz.png" alt="VeStope.cz"><div class="eyebrow">TESTOVACÍ VERZE</div><h1>Připraveno?</h1><p>Aplikace je připravena zaznamenat jízdu rolbaře.</p><div id="location" class="location">Výchozí bod: <strong>zjišťuji…</strong></div><button id="start" class="start">START</button><div id="trackAnimation" class="track-animation" aria-hidden="true"><div class="track-base"></div><div class="track-done"></div><img class="groomer" src="./groomer.svg" alt=""><div class="snow"></div></div><div id="startStatus" class="status">GPS zatím nebylo spuštěno.</div><div class="account"><span>${escapeHtml(groomer?.name||user?.email||"Rolbař")}</span><button id="logout" class="secondary">Odhlásit</button></div></section>`;document.getElementById("start").addEventListener("click",startTracking);document.getElementById("logout").addEventListener("click",async()=>{stopTracking();await client.auth.signOut();loginView()});loadAreaName(groomer?.default_area_id)}
async function loadAreaName(areaId){const el=document.getElementById("location");if(!areaId||!el)return;const{data}=await client.from("areas").select("name").eq("id",areaId).maybeSingle();if(data?.name)el.innerHTML=`Oblast: <strong>${escapeHtml(data.name)}</strong><br><span style="font-size:12px;color:#7a8798">Výchozí bod bude určen po získání GPS.</span>`}
async function detectNearestStart(position,areaId){if(!areaId)return null;const{data,error}=await client.from("ski_locations").select("name,latitude,longitude,location_types").eq("area_id",areaId).eq("active",true);if(error||!data?.length)return null;const starts=data.filter(x=>Array.isArray(x.location_types)&&x.location_types.includes("START")&&Number.isFinite(x.latitude)&&Number.isFinite(x.longitude));if(!starts.length)return null;let nearest=null,best=Infinity;for(const x of starts){const d=distanceM(position.coords.latitude,position.coords.longitude,x.latitude,x.longitude);if(d<best){best=d;nearest={...x,distance:Math.round(d)}}}return nearest&&nearest.distance<=1000?nearest:null}
function distanceM(lat1,lon1,lat2,lon2){const r=6371000,p=Math.PI/180,dLat=(lat2-lat1)*p,dLon=(lon2-lon1)*p,a=Math.sin(dLat/2)**2+Math.cos(lat1*p)*Math.cos(lat2*p)*Math.sin(dLon/2)**2;return 2*r*Math.asin(Math.sqrt(a))}
function startTracking(){const button=document.getElementById("start"),status=document.getElementById("startStatus"),animation=document.getElementById("trackAnimation"),locationEl=document.getElementById("location");if(!navigator.geolocation){status.textContent="Toto zařízení nepodporuje získání polohy.";status.style.color="#b3261e";return}button.disabled=true;button.textContent="GPS…";status.textContent="Žádám zařízení o povolení GPS…";status.style.color="#687587";navigator.geolocation.getCurrentPosition(async position=>{const draft={id:crypto.randomUUID(),startedAt:new Date().toISOString(),synced:false,points:[]};saveGpsPoint(draft,position);localStorage.setItem("vestope:groomer:phaseA:draft",JSON.stringify(draft));startGpsWatch(draft);button.disabled=false;button.classList.add("running");button.textContent="BĚŽÍ";animation.classList.add("active");const profile=await getAuthorizedProfile();const nearest=await detectNearestStart(position,profile?.groomer?.default_area_id);if(locationEl){if(nearest){locationEl.innerHTML=`Výchozí bod: <strong>${escapeHtml(nearest.name)}</strong><br><span style="font-size:12px;color:#7a8798">GPS ${nearest.distance} m od bodu</span>`}else{locationEl.innerHTML=`Výchozí bod: <strong>mimo známé výchoziště</strong><br><span style="font-size:12px;color:#7a8798">Poloha byla zaznamenána, ale nejbližší výchozí bod nebyl v dosahu.</span>`}}status.textContent=`GPS aktivní · přesnost ${Math.round(position.coords.accuracy)} m`;status.style.color="#1769aa"},error=>{button.disabled=false;button.textContent="START";status.style.color="#b3261e";if(error.code===1)status.textContent="Přístup k poloze byl zamítnut. Povol GPS v nastavení zařízení/prohlížeče.";else if(error.code===2)status.textContent="Poloha není momentálně dostupná. Zkus START znovu.";else status.textContent="GPS se nepodařilo získat včas. Zkus START znovu."},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function startGpsWatch(draft){if(gpsWatchId!==null)navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=navigator.geolocation.watchPosition(position=>{saveGpsPoint(draft,position);localStorage.setItem("vestope:groomer:phaseA:draft",JSON.stringify(draft));const status=document.getElementById("startStatus");if(status)status.textContent=`GPS aktivní · ${draft.points.length} bodů · přesnost ${Math.round(position.coords.accuracy)} m`},error=>{const status=document.getElementById("startStatus");if(status)status.textContent=error.code===1?"Přístup k GPS byl zamítnut.":"GPS signál je momentálně nedostupný. Data zůstanou v zařízení."},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
function saveGpsPoint(draft,position){draft.points.push({latitude:position.coords.latitude,longitude:position.coords.longitude,accuracy:position.coords.accuracy,speed:position.coords.speed,heading:position.coords.heading,timestamp:new Date(position.timestamp||Date.now()).toISOString()})}
function stopTracking(){if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
(async()=>{if("serviceWorker"in navigator){try{await navigator.serviceWorker.register("./sw.js")}catch(e){console.warn("SW",e)}}const profile=await getAuthorizedProfile();if(profile)homeView(profile.user,profile.groomer);else loginView()})();
</script>
</body>
</html>

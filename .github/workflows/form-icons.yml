name: Add form section graphics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source already contains form graphics
        run: |
          grep -q 'trackTypeIcon' index.html
          grep -q 'quality-track' index.html
          grep -q 'quality-snow' index.html

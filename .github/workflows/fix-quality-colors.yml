name: Fix quality colors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix colors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.quality-option.selected .quality-dot{border-color:#0b63ce;box-shadow:inset 0 0 0 3px #fff;background:#0b63ce}'
          new=old+'.quality-option.selected .quality-dot.q-excellent{background:#20b85a;border-color:#20b85a}.quality-option.selected .quality-dot.q-verygood{background:#91d99a;border-color:#91d99a}.quality-option.selected .quality-dot.q-passable{background:#f2d34f;border-color:#f2d34f}.quality-option.selected .quality-dot.q-limited{background:#ef9b3f;border-color:#ef9b3f}.quality-option.selected .quality-dot.q-bad{background:#d83b3b;border-color:#d83b3b}'
          if old not in s: raise SystemExit('quality CSS not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Opravené barvy semaforu kvality stopy' || exit 0
          git push

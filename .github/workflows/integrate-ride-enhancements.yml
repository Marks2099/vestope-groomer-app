name: Integrate ride enhancements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-fix:
    if: "${{ !startsWith(github.event.head_commit.message, 'fix: GPS') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ride enhancement source
        run: |
          test -s ride-enhancements.js
          grep -q 'ride-controls' ride-enhancements.js
          grep -q 'pauseRide' ride-enhancements.js
          grep -q 'addRidePhoto' ride-enhancements.js
          grep -q 'daily-stats' ride-enhancements.js

      - name: Activate ride enhancements and final form styling
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          p = Path('index.html')
          s = p.read_text()
          scripts = '<script src="./ride-enhancements.js?v=20"></script><script src="./gps-guard.js?v=20"></script>'
          if './ride-enhancements.js?v=20' not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no closing body tag')
              s = s.replace('</body>', scripts + '</body>', 1)
          p.write_text(s)

          r = Path('ride-enhancements.js')
          js = r.read_text()
          js = re.sub(r'\n<style id="ride-final-form-fix">.*?</style>\n', '\n', js, count=1, flags=re.S)

          new_fix = r'''const fixFormIcons=()=>{
            const ROLBA='<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 42h45l-5-13H30V15h13v14"/><path d="M30 29H20v13"/><path d="M10 42l-6 7h55"/><path d="M16 49a6 6 0 0 0 12 0m12 0a6 6 0 0 0 12 0"/><path fill="white" stroke="none" d="M30 15h13l-2-5H32z"/></g></svg>';
            const SNOW='<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><path d="M32 7v50M10 19l44 26M10 45l44-26"/><path d="M32 7l-5 7m5-7 5 7m-5 43-5-7m5 7 5-7M10 19l9 1m-9-1 4 8m40-8-9 1m9-1-4 8M10 45l9-1m-9 1 4-8m40 8-9-1m9 1-4-8"/></g></svg>';
            const TRACK='<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="12" r="3" fill="white" stroke="none"/><path d="M22 17v15l-8 12m8-12 9 7m-9-4 10 13M42 12a3 3 0 1 0 0 6 3 3 0 0 0-0-6Z"/><path d="M42 19v14l-7 12m7-12 9 6m-9-3 9 13M7 50h20m7 0h23"/></g></svg>';
            const addIcon=(el,cls,svg)=>{if(!el||el.querySelector('.'+cls))return;const i=document.createElement('div');i.className=cls;i.setAttribute('aria-hidden','true');i.innerHTML=svg;el.insertBefore(i,el.firstChild)};
            document.querySelectorAll('.formSection').forEach(section=>{
              const quality=section.querySelector('.quality-title');
              if(quality&&quality.textContent.trim()==='Jaká je podle tebe stopa?')addIcon(quality,'qualitySectionIcon',ROLBA);
              const h=section.querySelector(':scope > h3');
              if(h&&h.textContent.trim()==='Sněhové podmínky')addIcon(h,'snowSectionIcon',SNOW);
              const header=section.querySelector('.sectionHeader');
              if(header&&header.querySelector('h3')?.textContent.trim()==='Druh stopy'){
                let i=header.querySelector('.trackTypeIcon');
                if(!i){i=document.createElement('div');i.className='trackTypeIcon';header.insertBefore(i,header.firstChild)}
                i.innerHTML=TRACK;
                i.style.background='#78a8ee';
              }
            });
          }'''
          pattern=r'const fixFormIcons=\(\)=>\{.*?(?:<style id="ride-final-form-fix">.*?</style>\s*)?const init='
          js, n = re.subn(pattern, new_fix + '\n  const init=', js, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('fixFormIcons block not found')

          css_html = r'''<style id="ride-final-form-fix">
          .qualitySectionIcon,.snowSectionIcon{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:#78a8ee;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(62,111,181,.16)}
          .qualitySectionIcon svg,.snowSectionIcon svg{width:28px;height:28px;display:block}
          .quality-title{display:flex!important;align-items:center;gap:10px;font-size:17px!important;font-weight:800!important;color:#142b4b!important}
          .formSection:has(>h3)>.snowSectionIcon{margin-bottom:10px}
          .formSection:has(>h3){display:grid;grid-template-columns:38px 1fr}.formSection:has(>h3)>.snowSectionIcon{grid-column:1;grid-row:1}.formSection:has(>h3)>h3{grid-column:2;grid-row:1;margin:0!important;align-self:center}.formSection:has(>h3)>.sectionHint,.formSection:has(>h3)>.check-grid{grid-column:1/-1}
          .modal{align-items:flex-start!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;padding:12px 12px calc(24px + env(safe-area-inset-bottom))!important}
          .modalCard{max-height:none!important;overflow:visible!important;margin:auto 0!important;padding:24px 24px calc(24px + env(safe-area-inset-bottom))!important}
          .formActions{position:sticky!important;bottom:0!important;padding:10px 0 4px!important;margin-top:18px!important;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 18px)!important;z-index:5!important}
          @media(max-width:600px){.check-grid{grid-template-columns:1fr 1fr!important;gap:6px!important}.modalCard{padding:20px 16px calc(20px + env(safe-area-inset-bottom))!important}.formActions{gap:8px!important}.formActions button{padding:12px 10px!important}.qualitySectionIcon,.snowSectionIcon{width:36px;height:36px;flex-basis:36px}.qualitySectionIcon svg,.snowSectionIcon svg{width:27px;height:27px}}
          </style>'''
          if 'ride-final-form-fix' not in js:
              marker='  const init=()=>{'
              if marker not in js:
                  raise SystemExit('init marker not found')
              js=js.replace(marker,'  const FINAL_CSS='+json.dumps(css_html)+';\n'+marker,1)
          if 's.innerHTML=CSS;document.head.appendChild(s);' in js:
              js=js.replace('s.innerHTML=CSS;document.head.appendChild(s);','s.innerHTML=CSS+FINAL_CSS;document.head.appendChild(s);',1)
          elif 's.innerHTML=CSS+FINAL_CSS;document.head.appendChild(s);' not in js:
              raise SystemExit('enhancement CSS injection line not found')

          js=js.replace('ms+=b-a;count++','ms+=Math.max(0,(b-a)-Number(r?.pausedMs||0));count++',1)
          r.write_text(js)

          sw=Path('sw.js')
          w=sw.read_text().replace('vestope-groomer-phase-a-v19','vestope-groomer-phase-a-v20').replace('ride-enhancements.js?v=19','ride-enhancements.js?v=20').replace('gps-guard.js?v=19','gps-guard.js?v=20')
          sw.write_text(w)
          PY

      - name: Verify app contains the active enhancements
        run: |
          grep -q 'ride-enhancements.js?v=20' index.html
          grep -q 'qualitySectionIcon' ride-enhancements.js
          grep -q 'snowSectionIcon' ride-enhancements.js
          grep -q 'daily-stats' ride-enhancements.js
          grep -q 'pausedMs' ride-enhancements.js
          node --check ride-enhancements.js

      - name: Commit integrated ride app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ride-enhancements.js sw.js
          git diff --cached --quiet || git commit -m "fix: activate ride enhancements"
          git push

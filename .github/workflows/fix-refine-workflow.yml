name: Fix refine workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix workflow syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/refine-location-ui.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("          const thanks='''\n", "          const thanks=\n")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/refine-location-ui.yml
          git commit -m 'Opravena syntaxe refine workflow' || exit 0
          git push

name: Validate app

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML and JavaScript files exist
        run: |
          test -s index.html
          test -s ride-engine.js
          test -s sw.js
          echo "Source files present. No workflow modifies application source."
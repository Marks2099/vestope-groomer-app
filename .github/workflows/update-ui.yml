name: Update app UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI changes
        run: python3 scripts/update_ui.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'GPS zamčené bez signálu a rozšířený formulář jízdy'
          git push

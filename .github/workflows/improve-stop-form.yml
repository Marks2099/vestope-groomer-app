name: Improve stop form layout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify form layout source
        run: |
          grep -q 'formSection' index.html
          grep -q 'modalCard' index.html
          grep -q 'trackTypeIcon' index.html
